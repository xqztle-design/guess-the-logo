<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Logo Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ธีมสีพาสเทล */
            --bg-color: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* พื้นหลังขาวนวล */
            --main-bg: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); /* ฟ้าพาสเทล */
            --accent-pink: #ff9ff3;
            --accent-blue: #54a0ff;
            --text-color: #576574; /* สีเทาเข้ม อ่านง่ายสบายตา */
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%); /* พื้นหลังสีลูกกวาด */
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
        }

        /* --- Screens --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen.active { display: flex; }

        /* --- Typography --- */
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            font-weight: 800;
            letter-spacing: 1px;
        }

        p { font-size: 1.4rem; color: #fff; margin-bottom: 30px; font-weight: 600; }

        /* --- Buttons (สไตล์นุ่มนิ่ม) --- */
        .btn {
            padding: 15px 60px;
            font-size: 26px;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background-color: white;
            color: var(--accent-blue);
            box-shadow: 0 8px 0 rgba(0,0,0,0.1); /* เงาแบบการ์ตูน */
            font-family: 'Prompt', sans-serif;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 0 rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .start-btn { color: #ff6b6b; }
        .restart-btn { color: #1dd1a1; margin-top: 20px; }

        /* --- Game HUD --- */
        .score-board {
            position: absolute;
            top: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 40px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 22px;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .score-board span { color: #ff9ff3; font-weight: 800; }

        /* --- Game Cards --- */
        .game-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .option-card {
            width: 260px;
            height: 260px;
            background-color: var(--card-bg);
            border-radius: 35px; /* มุมมนมาก */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 8px solid white;
            box-shadow: 0 10px 20px rgba(162, 155, 254, 0.2);
            position: relative;
            overflow: hidden;
        }

        .option-card:hover {
            transform: scale(1.05) rotate(2deg); /* หมุนนิดๆ ให้น่ารัก */
            border-color: #ffeaa7;
            box-shadow: 0 15px 30px rgba(255, 234, 167, 0.4);
        }

        .logo-img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        /* --- Animation --- */
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .game-container { flex-direction: column; gap: 20px; }
            .option-card { width: 180px; height: 180px; border-radius: 25px; }
            h1 { font-size: 2.5rem; text-align: center;}
            .score-board { width: 80%; justify-content: center; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="start-screen" class="screen active">
        <h1>GUESS THE LOGO</h1>
        <p>✨ ทายซิ...อันไหนของจริง? ✨</p>
        <button class="btn start-btn" onclick="startGame()">เริ่มเล่นเลย! 🎮</button>
    </div>

    <div id="game-screen" class="screen">

            <div>ข้อที่: <span id="current-q">1</span> / <span id="total">0</span></div>
            <div>คะแนน: <span id="score">0</span> 💖</div>
        </div>
        <div id="quiz-area" class="game-container">
            </div>
    </div>

            <span id="final-score" style="color: #fff; font-size: 60px; font-weight: 800; text-shadow: 2px 2px 0 rgba(0,0,0,0.1);">0</span> 
            <br>ข้อ แน่ะ! เก่งมาก 👍

            { correct: `<img src="domino_true.png" class="logo-img">`, wrong: `<img src="domino_false.png" class="logo-img">` },
        ];

        let currentLevel = 0;
        let score = 0;
        
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const quizArea = document.getElementById('quiz-area');
        const scoreDisplay = document.getElementById('score');
        const currentQDisplay = document.getElementById('current-q');
        const totalDisplay = document.getElementById('total');
        const finalScoreDisplay = document.getElementById('final-score');

        totalDisplay.innerText = quizData.length;

        function startGame() {
            startScreen.classList.remove('active');
            gameScreen.classList.add('active');
            loadLevel();
        }

        function loadLevel() {
            if (currentLevel >= quizData.length) {
                endGame();
                return;
            }

            currentQDisplay.innerText = currentLevel + 1;
            const currentData = quizData[currentLevel];
            quizArea.innerHTML = ''; 

            let options = [];
            if (Math.random() < 0.5) {
                options = [
                    { html: currentData.correct, isCorrect: true },
                    { html: currentData.wrong, isCorrect: false }
                ];
            } else {
                options = [
                    { html: currentData.wrong, isCorrect: false },
                    { html: currentData.correct, isCorrect: true }
                ];
            }

            options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = opt.html;
                card.onclick = () => checkAnswer(opt.isCorrect);
                quizArea.appendChild(card);
            });
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                score++;
                scoreDisplay.innerText = score;
            }
            currentLevel++;
            loadLevel();
        }

        function endGame() {
            gameScreen.classList.remove('active');
            resultScreen.classList.add('active');
            finalScoreDisplay.innerText = score + " / " + quizData.length;
        }
